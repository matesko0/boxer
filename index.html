<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxer.io | Battle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { cursor: crosshair; user-select: none; }
        canvas { image-rendering: pixelated; }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans overflow-hidden">

    <!-- UI Overlay -->
    <div class="absolute top-6 left-1/2 -translate-x-1/2 w-full max-w-2xl px-4 pointer-events-none">
        <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700 rounded-2xl p-4 flex justify-between items-center shadow-2xl">
            <div class="flex flex-col">
                <span class="text-slate-400 text-xs uppercase tracking-widest font-bold">Hráč</span>
                <span id="pId" class="text-2xl font-black text-blue-400">?</span>
            </div>
            
            <div id="game-msg" class="text-center font-bold text-xl text-yellow-400 animate-pulse">
                Najdi soupeře a zbuš ho!
            </div>

            <div class="text-right text-slate-400 text-xs">
                LMB: Útok | RMB: Blok<br>WASD: Pohyb
            </div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="death-screen" class="hidden absolute inset-0 bg-black/80 backdrop-blur-xl z-50 flex flex-col items-center justify-center">
        <h1 class="text-8xl font-black text-red-600 mb-4 tracking-tighter">KO!</h1>
        <p class="text-slate-400 text-xl">Resetování arény za okamžik...</p>
    </div>

    <canvas id="game" class="block w-full h-full"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJdPiQ-diG_VnRGq6vnZshVUhViPmy_Qk",
            authDomain: "boxer-e8def.firebaseapp.com",
            databaseURL: "https://boxer-e8def-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "boxer-e8def",
            storageBucket: "boxer-e8def.firebasestorage.app",
            messagingSenderId: "533223374509",
            appId: "1:533223374509:web:516cb9e4c9a5fff85f1024"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const urlParams = new URLSearchParams(window.location.search);
        const myId = urlParams.get('p') || '1';
        const enemyId = myId === '1' ? '2' : '1';
        document.getElementById('pId').innerText = myId;

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const deathScreen = document.getElementById('death-screen');
        
        let players = {};
        let lastAttack = 0;
        let isResetting = false;

        let myState = {
            x: myId === '1' ? 200 : window.innerWidth - 200,
            y: window.innerHeight / 2,
            angle: 0,
            hp: 100,
            isAttacking: false,
            isBlocking: false
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();

        window.oncontextmenu = (e) => e.preventDefault();

        set(ref(db, 'players/' + myId), myState);
        onDisconnect(ref(db, 'players/' + myId)).remove();

        onValue(ref(db, 'players'), (snapshot) => {
            players = snapshot.val() || {};
            checkWinCondition();
        });

        function checkWinCondition() {
            if (isResetting) return;
            
            for (let id in players) {
                if (players[id].hp <= 0) {
                    isResetting = true;
                    deathScreen.classList.remove('hidden');
                    setTimeout(resetGame, 3000);
                    break;
                }
            }
        }

        function resetGame() {
            myState.hp = 100;
            myState.x = myId === '1' ? 200 : canvas.width - 200;
            myState.y = canvas.height / 2;
            myState.isBlocking = false;
            myState.isAttacking = false;
            update(ref(db, 'players/' + myId), myState);
            deathScreen.classList.add('hidden');
            isResetting = false;
        }

        canvas.addEventListener('mousemove', (e) => {
            myState.angle = Math.atan2(e.clientY - myState.y, e.clientX - myState.x);
            sync();
        });

        window.addEventListener('mousedown', (e) => {
            if (myState.hp <= 0 || isResetting) return;
            if (e.button === 0 && !myState.isBlocking) {
                const now = Date.now();
                if (now - lastAttack > 400) {
                    performAttack();
                    lastAttack = now;
                }
            } else if (e.button === 2) {
                myState.isBlocking = true;
                sync();
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 2) {
                myState.isBlocking = false;
                sync();
            }
        });

        function performAttack() {
            myState.isAttacking = true;
            sync();
            const enemy = players[enemyId];
            if (enemy && !enemy.isBlocking) {
                const dist = Math.sqrt(Math.pow(myState.x - enemy.x, 2) + Math.pow(myState.y - enemy.y, 2));
                const angleToEnemy = Math.atan2(enemy.y - myState.y, enemy.x - myState.x);
                let angleDiff = Math.abs(myState.angle - angleToEnemy);
                if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;
                
                if (dist < 90 && angleDiff < 0.6) {
                    const newHp = Math.max(0, (enemy.hp || 100) - 12);
                    update(ref(db, 'players/' + enemyId), { hp: newHp });
                }
            }
            setTimeout(() => { myState.isAttacking = false; sync(); }, 100);
        }

        function sync() { update(ref(db, 'players/' + myId), myState); }

        const keys = {};
        window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

        function updateMovement() {
            if (myState.hp <= 0 || myState.isBlocking || isResetting) return;
            const speed = 6;
            let moved = false;
            if (keys['w'] || keys['s'] || keys['a'] || keys['d']) {
                if (keys['w']) myState.y -= speed;
                if (keys['s']) myState.y += speed;
                if (keys['a']) myState.x -= speed;
                if (keys['d']) myState.x += speed;
                moved = true;
            }
            if (moved) {
                myState.x = Math.max(30, Math.min(canvas.width - 30, myState.x));
                myState.y = Math.max(30, Math.min(canvas.height - 30, myState.y));
                sync();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let id in players) {
                const p = players[id];
                ctx.save();
                ctx.translate(p.x, p.y);
                
                // Stín
                ctx.fillStyle = "rgba(0,0,0,0.3)";
                ctx.beginPath();
                ctx.ellipse(0, 35, 25, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.rotate(p.angle);

                // Tělo (zaoblený čtverec)
                ctx.fillStyle = id === '1' ? '#ef4444' : '#22c55e';
                if (p.isBlocking) ctx.fillStyle = '#3b82f6';
                
                // Kreslení se zaoblením
                const size = 50;
                ctx.beginPath();
                ctx.roundRect(-size/2, -size/2, size, size, 12);
                ctx.fill();

                // Obličej/Oči
                ctx.fillStyle = "white";
                ctx.fillRect(10, -15, 8, 8);
                ctx.fillRect(10, 7, 8, 8);

                // Útok (pěsti)
                if (p.isAttacking) {
                    ctx.fillStyle = "#fff";
                    ctx.beginPath();
                    ctx.arc(35, 0, 15, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();

                // HP Bar
                const barWidth = 80;
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.roundRect(p.x - barWidth/2, p.y - 60, barWidth, 8, 4);
                ctx.fill();
                
                ctx.fillStyle = p.hp > 30 ? "#22c55e" : "#ef4444";
                ctx.roundRect(p.x - barWidth/2, p.y - 60, (p.hp / 100) * barWidth, 8, 4);
                ctx.fill();
            }
            
            updateMovement();
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
