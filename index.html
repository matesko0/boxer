<!DOCTYPE html>
<html>
<head>
    <title>Boxer Combat Duo</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: #fff; font-family: 'Courier New', monospace; overflow: hidden; text-align: center; }
        canvas { background: #000; border: 4px solid #444; margin-top: 10px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .controls { color: #aaa; font-size: 0.9rem; margin-top: 5px; }
        b { color: #ff4757; }
    </style>
</head>
<body>
    <h2>BOJOVKA: Hráč <span id="pId">?</span></h2>
    <div class="controls">Pohyb: <b>Šipky</b> | Útok: <b>Mezerník</b> | Blok: <b>Klávesa B</b></div>
    <canvas id="game" width="800" height="500"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJdPiQ-diG_VnRGq6vnZshVUhViPmy_Qk",
            authDomain: "boxer-e8def.firebaseapp.com",
            databaseURL: "https://boxer-e8def-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "boxer-e8def",
            storageBucket: "boxer-e8def.firebasestorage.app",
            messagingSenderId: "533223374509",
            appId: "1:533223374509:web:516cb9e4c9a5fff85f1024"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const urlParams = new URLSearchParams(window.location.search);
        const myId = urlParams.get('p') || '1';
        const enemyId = myId === '1' ? '2' : '1';
        document.getElementById('pId').innerText = myId;

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        let players = {};
        let myState = {
            x: myId === '1' ? 100 : 600,
            y: 200,
            hp: 100,
            isAttacking: false,
            isBlocking: false
        };

        // Reset HP a pozice při startu
        set(ref(db, 'players/' + myId), myState);
        onDisconnect(ref(db, 'players/' + myId)).remove();

        onValue(ref(db, 'players'), (snapshot) => {
            players = snapshot.val() || {};
            draw();
        });

        function checkHit() {
            const enemy = players[enemyId];
            if (!enemy) return;

            // Vzdálenost mezi hráči
            const dist = Math.sqrt(Math.pow(myState.x - enemy.x, 2) + Math.pow(myState.y - enemy.y, 2));
            
            if (dist < 60 && !enemy.isBlocking) {
                const newHp = Math.max(0, (enemy.hp || 100) - 10);
                update(ref(db, 'players/' + enemyId), { hp: newHp });
            }
        }

        function draw() {
            ctx.fillStyle = "#222";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let id in players) {
                const p = players[id];
                const isMe = id === myId;
                
                // Vykreslení těla
                ctx.fillStyle = id === '1' ? '#ff4757' : '#2ed573';
                if (p.isBlocking) ctx.fillStyle = '#54a0ff'; // Modrá při bloku
                
                ctx.shadowBlur = p.isAttacking ? 20 : 0;
                ctx.shadowColor = "white";
                ctx.fillRect(p.x, p.y, 50, 50);
                ctx.shadowBlur = 0;

                // Vykreslení útoku (bílé kolečko)
                if (p.isAttacking) {
                    ctx.strokeStyle = "white";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(p.x - 5, p.y - 5, 60, 60);
                }

                // HP Bar
                ctx.fillStyle = "#333";
                ctx.fillRect(p.x, p.y - 20, 50, 8);
                ctx.fillStyle = p.hp > 30 ? "#2ecc71" : "#e74c3c";
                ctx.fillRect(p.x, p.y - 20, (p.hp / 100) * 50, 8);

                ctx.fillStyle = "#fff";
                ctx.font = "bold 12px Arial";
                ctx.fillText(id === myId ? "TY" : "SOUPEŘ", p.x, p.y - 25);
                
                if (p.hp <= 0) {
                    ctx.fillStyle = "red";
                    ctx.font = "40px Arial";
                    ctx.fillText("KO", p.x, p.y + 40);
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (myState.hp <= 0) return; // Mrtví nehrajou

            let moved = false;
            if (e.key === 'ArrowUp') { myState.y -= 15; moved = true; }
            if (e.key === 'ArrowDown') { myState.y += 15; moved = true; }
            if (e.key === 'ArrowLeft') { myState.x -= 15; moved = true; }
            if (e.key === 'ArrowRight') { myState.x += 15; moved = true; }
            
            if (e.code === 'Space' && !myState.isAttacking) {
                myState.isAttacking = true;
                checkHit();
                setTimeout(() => { 
                    myState.isAttacking = false; 
                    update(ref(db, 'players/' + myId), { isAttacking: false });
                }, 200);
                moved = true;
            }

            if (e.key.toLowerCase() === 'b') {
                myState.isBlocking = true;
                moved = true;
            }

            if (moved) {
                myState.x = Math.max(0, Math.min(canvas.width - 50, myState.x));
                myState.y = Math.max(0, Math.min(canvas.height - 50, myState.y));
                update(ref(db, 'players/' + myId), myState);
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() === 'b') {
                myState.isBlocking = false;
                update(ref(db, 'players/' + myId), { isBlocking: false });
            }
        });

        // Loop pro plynulejší překreslování
        setInterval(draw, 1000/60);
    </script>
</body>
</html>
