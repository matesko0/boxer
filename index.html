<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxer.io | Fixed Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { cursor: crosshair; user-select: none; background-color: #020617; }
        canvas { image-rendering: auto; }
    </style>
</head>
<body class="text-white font-sans overflow-hidden">

    <div class="absolute top-6 left-1/2 -translate-x-1/2 w-full max-w-2xl px-4 pointer-events-none z-10">
        <div class="bg-slate-900/95 backdrop-blur-md border border-slate-700 rounded-2xl p-4 flex justify-between items-center shadow-2xl">
            <div class="flex flex-col">
                <span class="text-slate-500 text-[10px] uppercase tracking-[0.2em] font-black">Identita</span>
                <span id="pIdDisplay" class="text-2xl font-black">HRÁČ ?</span>
            </div>
            <div class="px-6 py-2 bg-slate-800 rounded-xl border border-slate-700 shadow-inner">
                <span id="game-msg" class="text-yellow-400 font-bold uppercase text-sm tracking-widest">Aréna připravena</span>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-slate-500 font-black uppercase mb-1">Ovládání</div>
                <div class="flex gap-2">
                    <kbd class="px-2 py-1 bg-slate-800 rounded border border-slate-600 text-[10px]">LMB</kbd>
                    <kbd class="px-2 py-1 bg-slate-800 rounded border border-slate-600 text-[10px]">RMB</kbd>
                </div>
            </div>
        </div>
    </div>

    <div id="death-screen" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-2xl z-50 flex flex-col items-center justify-center">
        <h1 class="text-9xl font-black text-red-600 mb-2 italic tracking-tighter animate-bounce">KO!</h1>
        <div class="w-64 h-2 bg-slate-800 rounded-full overflow-hidden">
            <div class="h-full bg-red-600 animate-[pulse_1s_infinite] w-full"></div>
        </div>
    </div>

    <canvas id="game" class="block w-full h-full"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJdPiQ-diG_VnRGq6vnZshVUhViPmy_Qk",
            authDomain: "boxer-e8def.firebaseapp.com",
            databaseURL: "https://boxer-e8def-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "boxer-e8def",
            storageBucket: "boxer-e8def.firebasestorage.app",
            messagingSenderId: "533223374509",
            appId: "1:533223374509:web:516cb9e4c9a5fff85f1024"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const urlParams = new URLSearchParams(window.location.search);
        const myId = urlParams.get('p') || '1';
        const enemyId = myId === '1' ? '2' : '1';

        const pColors = { '1': '#f87171', '2': '#60a5fa', '3': '#4ade80', '4': '#fbbf24' };
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        document.getElementById('pIdDisplay').innerText = `HRÁČ ${myId}`;
        document.getElementById('pIdDisplay').style.color = pColors[myId];

        let players = {};
        let isResetting = false;
        let lastAttack = 0;

        let myState = {
            x: myId === '1' ? 200 : window.innerWidth - 200,
            y: window.innerHeight / 2,
            angle: 0,
            hp: 100,
            isAttacking: false,
            isBlocking: false,
            color: pColors[myId] || '#ffffff'
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();

        window.oncontextmenu = (e) => e.preventDefault();

        // Inicializace v DB
        set(ref(db, 'players/' + myId), myState);
        onDisconnect(ref(db, 'players/' + myId)).remove();

        // HLAVNÍ POSLUCHAČ
        onValue(ref(db, 'players'), (snapshot) => {
            const data = snapshot.val() || {};
            players = data;

            // OPRAVA: Pokud mi někdo v DB ubral životy, musím si je aktualizovat i lokálně,
            // jinak bych je při dalším pohybu přepsal starou hodnotou.
            if (data[myId]) {
                myState.hp = data[myId].hp;
            }

            if (!isResetting) {
                for (let id in data) {
                    if (data[id].hp <= 0) {
                        triggerReset();
                        break;
                    }
                }
            }
        });

        function triggerReset() {
            isResetting = true;
            document.getElementById('death-screen').classList.remove('hidden');
            setTimeout(() => {
                myState.hp = 100;
                myState.x = myId === '1' ? 200 : canvas.width - 200;
                myState.y = canvas.height / 2;
                update(ref(db, 'players/' + myId), myState);
                document.getElementById('death-screen').classList.add('hidden');
                isResetting = false;
            }, 3000);
        }

        async function performAttack() {
            myState.isAttacking = true;
            sync();

            const enemySnap = await get(ref(db, 'players/' + enemyId));
            const enemy = enemySnap.val();

            if (enemy && !enemy.isBlocking && enemy.hp > 0) {
                const dist = Math.sqrt(Math.pow(myState.x - enemy.x, 2) + Math.pow(myState.y - enemy.y, 2));
                const angleToEnemy = Math.atan2(enemy.y - myState.y, enemy.x - myState.x);
                let angleDiff = Math.abs(myState.angle - angleToEnemy);
                if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;

                if (dist < 110 && angleDiff < 0.8) {
                    const newHp = Math.max(0, enemy.hp - 15);
                    // Zápis přímo do soupeřova uzlu
                    update(ref(db, 'players/' + enemyId), { hp: newHp });
                }
            }
            setTimeout(() => { myState.isAttacking = false; sync(); }, 100);
        }

        function sync() { 
            if (isResetting) return;
            update(ref(db, 'players/' + myId), myState); 
        }

        canvas.addEventListener('mousemove', (e) => {
            myState.angle = Math.atan2(e.clientY - myState.y, e.clientX - myState.x);
            sync();
        });

        window.addEventListener('mousedown', (e) => {
            if (myState.hp <= 0 || isResetting) return;
            if (e.button === 0 && !myState.isBlocking) {
                if (Date.now() - lastAttack > 450) {
                    performAttack();
                    lastAttack = Date.now();
                }
            } else if (e.button === 2) {
                myState.isBlocking = true;
                sync();
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 2) {
                myState.isBlocking = false;
                sync();
            }
        });

        const keys = {};
        window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

        function updateMovement() {
            if (myState.hp <= 0 || myState.isBlocking || isResetting) return;
            const speed = 7;
            let moved = false;
            if (keys['w'] || keys['s'] || keys['a'] || keys['d'] || keys['arrowup'] || keys['arrowdown'] || keys['arrowleft'] || keys['arrowright']) {
                if (keys['w'] || keys['arrowup']) myState.y -= speed;
                if (keys['s'] || keys['arrowdown']) myState.y += speed;
                if (keys['a'] || keys['arrowleft']) myState.x -= speed;
                if (keys['d'] || keys['arrowright']) myState.x += speed;
                moved = true;
            }
            if (moved) {
                myState.x = Math.max(40, Math.min(canvas.width - 40, myState.x));
                myState.y = Math.max(40, Math.min(canvas.height - 40, myState.y));
                sync();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Mřížka
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2;
            for(let i=0; i<canvas.width; i+=60) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=60) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

            for (let id in players) {
                const p = players[id];
                ctx.save();
                ctx.translate(p.x, p.y);
                
                // Stín
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.beginPath(); ctx.ellipse(0, 40, 30, 10, 0, 0, Math.PI * 2); ctx.fill();

                ctx.rotate(p.angle);

                // Tělo
                ctx.fillStyle = p.isBlocking ? '#3b82f6' : p.color;
                ctx.beginPath(); ctx.roundRect(-30, -30, 60, 60, 14); ctx.fill();
                
                // Oči
                ctx.fillStyle = "white";
                ctx.beginPath(); ctx.arc(15, -12, 6, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(15, 12, 6, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "black";
                ctx.beginPath(); ctx.arc(18, -12, 2.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(18, 12, 2.5, 0, Math.PI*2); ctx.fill();

                // Pěst při útoku
                if (p.isAttacking) {
                    ctx.fillStyle = "white";
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = "white";
                    ctx.beginPath(); ctx.arc(50, 0, 20, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                }

                ctx.restore();

                // HP Bar - VYLEPŠENÝ
                const bw = 100;
                const bh = 12;
                ctx.fillStyle = "#1e293b";
                ctx.beginPath(); ctx.roundRect(p.x - bw/2, p.y - 80, bw, bh, 6); ctx.fill();
                
                // Barva HP baru podle stavu
                let hpColor = "#22c55e";
                if (p.hp < 60) hpColor = "#eab308";
                if (p.hp < 30) hpColor = "#ef4444";
                
                ctx.fillStyle = hpColor;
                const currentHpWidth = Math.max(0, (p.hp / 100) * bw);
                ctx.beginPath(); ctx.roundRect(p.x - bw/2, p.y - 80, currentHpWidth, bh, 6); ctx.fill();

                // Text nad hráčem
                ctx.fillStyle = "white";
                ctx.font = "black 12px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(`P${id} [${p.hp}%]`, p.x, p.y - 90);
            }
            
            updateMovement();
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
