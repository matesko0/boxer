<!DOCTYPE html>
<html>
<head>
    <title>Boxer Duo Fix</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; text-align: center; }
        canvas { background: #111; border: 2px solid #444; margin-top: 20px; }
        #debug { position: fixed; top: 10px; left: 10px; text-align: left; font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div id="debug">Status: Inicializace...</div>
    <h2>Hráč <span id="pId">?</span></h2>
    <canvas id="game" width="600" height="400"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJdPiQ-diG_VnRGq6vnZshVUhViPmy_Qk",
            authDomain: "boxer-e8def.firebaseapp.com",
            databaseURL: "https://boxer-e8def-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "boxer-e8def",
            storageBucket: "boxer-e8def.firebasestorage.app",
            messagingSenderId: "533223374509",
            appId: "1:533223374509:web:516cb9e4c9a5fff85f1024"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const debug = document.getElementById('debug');
        
        const urlParams = new URLSearchParams(window.location.search);
        const myId = urlParams.get('p') || '1';
        document.getElementById('pId').innerText = myId;

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        let allPlayers = {};
        let myPos = { x: myId === '1' ? 100 : 400, y: 200 };

        // Zápis startovní pozice
        set(ref(db, 'players/' + myId), myPos);
        debug.innerText = "Status: Připojeno k Firebase";

        // Smazat mě, když zavřu okno
        onDisconnect(ref(db, 'players/' + myId)).remove();

        // Poslech změn
        onValue(ref(db, 'players'), (snapshot) => {
            allPlayers = snapshot.val() || {};
            draw();
        });

        function draw() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let id in allPlayers) {
                const p = allPlayers[id];
                ctx.fillStyle = id === '1' ? '#ff3e3e' : '#3eff3e';
                ctx.fillRect(p.x, p.y, 40, 40);
                ctx.fillStyle = "#fff";
                ctx.fillText("Hráč " + id, p.x, p.y - 10);
            }
        }

        window.addEventListener('keydown', (e) => {
            const speed = 15;
            if (e.key === 'ArrowUp') myPos.y -= speed;
            if (e.key === 'ArrowDown') myPos.y += speed;
            if (e.key === 'ArrowLeft') myPos.x -= speed;
            if (e.key === 'ArrowRight') myPos.x += speed;

            // Omezení pohybu v canvasu
            myPos.x = Math.max(0, Math.min(canvas.width - 40, myPos.x));
            myPos.y = Math.max(0, Math.min(canvas.height - 40, myPos.y));

            set(ref(db, 'players/' + myId), myPos);
        });

        // První vykreslení
        draw();
    </script>
</body>
</html>
