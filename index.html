<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxer.io | Battle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { cursor: crosshair; user-select: none; background-color: #020617; }
        canvas { image-rendering: auto; }
    </style>
</head>
<body class="text-white font-sans overflow-hidden">

    <div class="absolute top-6 left-1/2 -translate-x-1/2 w-full max-w-2xl px-4 pointer-events-none z-10">
        <div class="bg-slate-900/90 backdrop-blur-md border border-slate-700 rounded-2xl p-4 flex justify-between items-center shadow-2xl">
            <div class="flex flex-col">
                <span class="text-slate-400 text-xs uppercase tracking-widest font-bold">Hráč</span>
                <span id="pId" class="text-2xl font-black text-white">?</span>
            </div>
            <div id="game-msg" class="text-center font-bold text-lg text-yellow-400">
                LMB: Útok | RMB: Blok
            </div>
            <div class="text-right flex flex-col">
                <span class="text-slate-400 text-xs uppercase tracking-widest font-bold">Status</span>
                <span id="status-text" class="text-green-400 font-bold">Online</span>
            </div>
        </div>
    </div>

    <div id="death-screen" class="hidden absolute inset-0 bg-black/90 backdrop-blur-xl z-50 flex flex-col items-center justify-center">
        <h1 class="text-9xl font-black text-red-600 mb-4 tracking-tighter italic">KO!</h1>
        <p class="text-slate-400 text-2xl uppercase tracking-[0.5em]">Aréna se čistí...</p>
    </div>

    <canvas id="game" class="block w-full h-full"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJdPiQ-diG_VnRGq6vnZshVUhViPmy_Qk",
            authDomain: "boxer-e8def.firebaseapp.com",
            databaseURL: "https://boxer-e8def-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "boxer-e8def",
            storageBucket: "boxer-e8def.firebasestorage.app",
            messagingSenderId: "533223374509",
            appId: "1:533223374509:web:516cb9e4c9a5fff85f1024"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const urlParams = new URLSearchParams(window.location.search);
        const myId = urlParams.get('p') || '1';
        const enemyId = myId === '1' ? '2' : '1';

        const pColors = {
            '1': '#ef4444', // Červená
            '2': '#3b82f6', // Modrá
            '3': '#22c55e', // Zelená
            '4': '#eab308'  // Žlutá
        };

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const pIdSpan = document.getElementById('pId');
        pIdSpan.innerText = myId;
        pIdSpan.style.color = pColors[myId] || '#fff';

        let players = {};
        let lastAttack = 0;
        let isResetting = false;

        let myState = {
            x: myId === '1' ? 300 : window.innerWidth - 300,
            y: window.innerHeight / 2,
            angle: 0,
            hp: 100,
            isAttacking: false,
            isBlocking: false,
            color: pColors[myId] || '#ffffff'
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();

        window.oncontextmenu = (e) => e.preventDefault();

        set(ref(db, 'players/' + myId), myState);
        onDisconnect(ref(db, 'players/' + myId)).remove();

        onValue(ref(db, 'players'), (snapshot) => {
            players = snapshot.val() || {};
            if (!isResetting) {
                for (let id in players) {
                    if (players[id].hp <= 0) {
                        triggerReset();
                        break;
                    }
                }
            }
        });

        function triggerReset() {
            isResetting = true;
            document.getElementById('death-screen').classList.remove('hidden');
            setTimeout(() => {
                myState.hp = 100;
                myState.x = myId === '1' ? 300 : canvas.width - 300;
                myState.y = canvas.height / 2;
                update(ref(db, 'players/' + myId), myState);
                document.getElementById('death-screen').classList.add('hidden');
                isResetting = false;
            }, 3000);
        }

        async function performAttack() {
            myState.isAttacking = true;
            sync();

            // Získání nejčerstvějších dat o soupeři přímo z DB před útokem
            const enemySnap = await get(ref(db, 'players/' + enemyId));
            const enemy = enemySnap.val();

            if (enemy && !enemy.isBlocking && enemy.hp > 0) {
                const dist = Math.sqrt(Math.pow(myState.x - enemy.x, 2) + Math.pow(myState.y - enemy.y, 2));
                const angleToEnemy = Math.atan2(enemy.y - myState.y, enemy.x - myState.x);
                let angleDiff = Math.abs(myState.angle - angleToEnemy);
                if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;

                if (dist < 100 && angleDiff < 0.8) {
                    const newHp = Math.max(0, enemy.hp - 15);
                    update(ref(db, 'players/' + enemyId), { hp: newHp });
                }
            }
            setTimeout(() => { myState.isAttacking = false; sync(); }, 150);
        }

        function sync() { update(ref(db, 'players/' + myId), myState); }

        canvas.addEventListener('mousemove', (e) => {
            myState.angle = Math.atan2(e.clientY - myState.y, e.clientX - myState.x);
            sync();
        });

        window.addEventListener('mousedown', (e) => {
            if (myState.hp <= 0 || isResetting) return;
            if (e.button === 0 && !myState.isBlocking) {
                if (Date.now() - lastAttack > 500) {
                    performAttack();
                    lastAttack = Date.now();
                }
            } else if (e.button === 2) {
                myState.isBlocking = true;
                sync();
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 2) {
                myState.isBlocking = false;
                sync();
            }
        });

        const keys = {};
        window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

        function updateMovement() {
            if (myState.hp <= 0 || myState.isBlocking || isResetting) return;
            const speed = 7;
            let moved = false;
            if (keys['w'] || keys['arrowup']) { myState.y -= speed; moved = true; }
            if (keys['s'] || keys['arrowdown']) { myState.y += speed; moved = true; }
            if (keys['a'] || keys['arrowleft']) { myState.x -= speed; moved = true; }
            if (keys['d'] || keys['arrowright']) { myState.x += speed; moved = true; }
            
            if (moved) {
                myState.x = Math.max(40, Math.min(canvas.width - 40, myState.x));
                myState.y = Math.max(40, Math.min(canvas.height - 40, myState.y));
                sync();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Mřížka na pozadí
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=50) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

            for (let id in players) {
                const p = players[id];
                ctx.save();
                ctx.translate(p.x, p.y);
                
                // Stín
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.beginPath(); ctx.ellipse(0, 40, 30, 12, 0, 0, Math.PI * 2); ctx.fill();

                ctx.rotate(p.angle);

                // Tělo
                ctx.fillStyle = p.isBlocking ? '#60a5fa' : p.color;
                ctx.beginPath();
                ctx.roundRect(-30, -30, 60, 60, 15);
                ctx.fill();
                
                // Oči
                ctx.fillStyle = "white";
                ctx.beginPath(); ctx.arc(15, -12, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(15, 12, 5, 0, Math.PI*2); ctx.fill();

                // Útok - pěst
                if (p.isAttacking) {
                    ctx.fillStyle = "white";
                    ctx.beginPath(); ctx.arc(45, 0, 18, 0, Math.PI*2); ctx.fill();
                }

                ctx.restore();

                // HP Bar
                const bw = 100;
                ctx.fillStyle = "#0f172a";
                ctx.roundRect(p.x - bw/2, p.y - 75, bw, 10, 5); ctx.fill();
                ctx.fillStyle = p.hp > 40 ? "#22c55e" : "#ef4444";
                ctx.roundRect(p.x - bw/2, p.y - 75, (p.hp / 100) * bw, 10, 5); ctx.fill();
                
                // Jméno/ID
                ctx.fillStyle = "white";
                ctx.font = "bold 14px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(`Hráč ${id}`, p.x, p.y - 85);
            }
            
            updateMovement();
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
