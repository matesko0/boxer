<!DOCTYPE html>
<html>
<head>
    <title>MooMoo Boxer Edition</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; overflow: hidden; text-align: center; cursor: crosshair; }
        canvas { background: #2c3e50; border: 5px solid #34495e; margin-top: 10px; }
        .ui { position: fixed; top: 10px; width: 100%; pointer-events: none; }
    </style>
</head>
<body>
    <div class="ui">
        <h2>Hráč <span id="pId">?</span></h2>
        <p>LMB: Útok | RMB: Blok (držením) | Pohyb: Šipky/WASD</p>
    </div>
    <canvas id="game" width="1000" height="600"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJdPiQ-diG_VnRGq6vnZshVUhViPmy_Qk",
            authDomain: "boxer-e8def.firebaseapp.com",
            databaseURL: "https://boxer-e8def-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "boxer-e8def",
            storageBucket: "boxer-e8def.firebasestorage.app",
            messagingSenderId: "533223374509",
            appId: "1:533223374509:web:516cb9e4c9a5fff85f1024"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const urlParams = new URLSearchParams(window.location.search);
        const myId = urlParams.get('p') || '1';
        const enemyId = myId === '1' ? '2' : '1';
        document.getElementById('pId').innerText = myId;

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        let players = {};
        let lastAttack = 0;
        const ATTACK_COOLDOWN = 500; // ms

        let myState = {
            x: myId === '1' ? 200 : 800,
            y: 300,
            angle: 0,
            hp: 100,
            isAttacking: false,
            isBlocking: false
        };

        // Zakázat pravé tlačítko (menu)
        window.oncontextmenu = (e) => e.preventDefault();

        set(ref(db, 'players/' + myId), myState);
        onDisconnect(ref(db, 'players/' + myId)).remove();

        onValue(ref(db, 'players'), (snapshot) => {
            players = snapshot.val() || {};
        });

        // Sledování myši pro rotaci
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            myState.angle = Math.atan2(mouseY - myState.y, mouseX - myState.x);
            sync();
        });

        // Útok a blok myší
        window.addEventListener('mousedown', (e) => {
            if (myState.hp <= 0) return;
            
            if (e.button === 0 && !myState.isBlocking) { // Levý klik - Útok
                const now = Date.now();
                if (now - lastAttack > ATTACK_COOLDOWN) {
                    performAttack();
                    lastAttack = now;
                }
            } else if (e.button === 2) { // Pravý klik - Blok
                myState.isBlocking = true;
                sync();
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 2) {
                myState.isBlocking = false;
                sync();
            }
        });

        function performAttack() {
            myState.isAttacking = true;
            sync();

            const enemy = players[enemyId];
            if (enemy && !enemy.isBlocking) {
                const dist = Math.sqrt(Math.pow(myState.x - enemy.x, 2) + Math.pow(myState.y - enemy.y, 2));
                // Kontrola vzdálenosti a úhlu (musíš mířit na něj)
                const angleToEnemy = Math.atan2(enemy.y - myState.y, enemy.x - myState.x);
                const angleDiff = Math.abs(myState.angle - angleToEnemy);
                
                if (dist < 80 && (angleDiff < 0.8 || angleDiff > 5.4)) {
                    const newHp = Math.max(0, (enemy.hp || 100) - 15);
                    update(ref(db, 'players/' + enemyId), { hp: newHp });
                }
            }

            setTimeout(() => {
                myState.isAttacking = false;
                sync();
            }, 150);
        }

        function sync() {
            update(ref(db, 'players/' + myId), myState);
        }

        // Pohyb (WASD i šipky)
        const keys = {};
        window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

        function updateMovement() {
            if (myState.hp <= 0 || myState.isBlocking) return;
            let speed = 5;
            if (keys['w'] || keys['arrowup']) myState.y -= speed;
            if (keys['s'] || keys['arrowdown']) myState.y += speed;
            if (keys['a'] || keys['arrowleft']) myState.x -= speed;
            if (keys['d'] || keys['arrowright']) myState.x += speed;
            
            if (keys['w'] || keys['s'] || keys['a'] || keys['d'] || keys['arrowup'] || keys['arrowdown'] || keys['arrowleft'] || keys['arrowright']) {
                sync();
            }
        }

        function draw() {
            ctx.fillStyle = "#2c3e50";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let id in players) {
                const p = players[id];
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);

                // Tělo postavy
                ctx.fillStyle = id === '1' ? '#ff4757' : '#2ed573';
                if (p.isBlocking) ctx.fillStyle = '#54a0ff';
                
                ctx.fillRect(-25, -25, 50, 50);
                
                // "Ruce" nebo směr útoku
                if (p.isAttacking) {
                    ctx.fillStyle = "white";
                    ctx.fillRect(20, -10, 30, 20);
                } else {
                    ctx.fillStyle = "rgba(255,255,255,0.3)";
                    ctx.fillRect(20, -5, 10, 10);
                }

                ctx.restore();

                // HP Bar (mimo rotaci)
                ctx.fillStyle = "#000";
                ctx.fillRect(p.x - 30, p.y - 45, 60, 10);
                ctx.fillStyle = p.hp > 0 ? (id === '1' ? '#ff4757' : '#2ed573') : "#000";
                ctx.fillRect(p.x - 30, p.y - 45, (p.hp / 100) * 60, 10);
            }
            
            updateMovement();
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
